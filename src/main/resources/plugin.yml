main: net.tfminecraft.birdmessenger.BirdMessenger
api-version: '1.21.10'
name: BirdMessenger
version: ${project.version}
author: MrEnzo99

# No loadbefore: TLibs loads after ItemsAdder, so loading before ItemsAdder or
# RPCharacters is a cycle that Paper refuses to start with.
depend: [TLibs]
softdepend: [RPCharacters, TFMCWeb, ItemsAdder]

commands:
  birdmessenger:
    description: BirdMessenger admin commands
    usage: /birdmessenger reload
    permission: birdmessenger.reload

permissions:
  birdmessenger.reload:
    description: Reload BirdMessenger config.yml and letters-config.yml
    default: op
